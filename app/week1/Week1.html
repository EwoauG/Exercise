<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List (Tailwind)</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-blue-100 flex justify-center items-center min-h-screen p-4 font-sans"
  >
    <div
      class="bg-blue-100 flex justify-center items-center min-h-screen p-4 font-sans"
    >
      <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-lg">
        <h2 class="text-xl font-bold text-center text-gray-900 mb-6">
          To-Do List
        </h2>

        <div class="flex gap-2 mb-6">
          <input
            type="text"
            class="flex-1 px-4 py-2.5 text-sm border border-blue-500 rounded-md outline-none focus:ring-2 focus:ring-blue-200 text-gray-700 placeholder-gray-400"
            placeholder="Mau ngerjain apa hari ini?"
          />
          <button
            class="bg-purple-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-md text-sm font-medium transition-colors"
          >
            Tambah
          </button>
        </div>

        <ul class="flex flex-col gap-3">
          <li
            class="flex justify-between items-center bg-grey-50 px-4 py-3 rounded-md border border-gray-100"
          >
            <span class="text-sm text-gray-700"> belajar di kamar</span>
            <button
              class="text-red-600 hover:text-red-800 text-sm font-semibold transition-colors"
            >
              Delete
            </button>
          </li>

          <li
            class="flex justify-between items-center bg-gray-50 px-4 py-3 rounded-md border border-gray-100"
          >
            <span class="text-sm text-gray-700">Ajil</span>
            <button
              class="text-red-600 hover:text-red-800 text-sm font-semibold transition-colors"
            >
              Delete
            </button>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
